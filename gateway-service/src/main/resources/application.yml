server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:http://localhost:8888/"
  cloud:
    config:
      username: configuser
      password: configpass123
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: personal-service
          uri: lb://PERSONAL-SERVICE
          predicates:
            - Path=/admin/**

        - id: vuelos-service
          uri: lb://VUELOS-SERVICE
          predicates:
            - Path=/vuelos/**

        - id: aviones-service
          uri: lb://AVIONES-SERVICE
          predicates:
            - Path=/aviones/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always