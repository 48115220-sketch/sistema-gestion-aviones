version: '3.8'

services:
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass
      - MYSQL_USER=auth_user
      - MYSQL_PASSWORD=auth_pass
      - MYSQL_DATABASE=auth_database
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - escuela-network

  admin-db:
    image: mysql:8.0
    container_name: admin-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass
      - MYSQL_USER=admin_user
      - MYSQL_PASSWORD=admin_pass
      - MYSQL_DATABASE=admin_database
    ports:
      - "3308:3306"
    volumes:
      - admin_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - escuela-network

  alumno-db:
    image: mysql:8.0
    container_name: alumno-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass
      - MYSQL_USER=alumno_user
      - MYSQL_PASSWORD=alumno_pass
      - MYSQL_DATABASE=alumno_database
    ports:
      - "3309:3306"
    volumes:
      - alumno_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - escuela-network

  curso-db:
    image: mysql:8.0
    container_name: curso-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass
      - MYSQL_USER=curso_user
      - MYSQL_PASSWORD=curso_pass
      - MYSQL_DATABASE=curso_database
    ports:
      - "3310:3306"
    volumes:
      - curso_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - escuela-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - escuela-network

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms64m -XX:+UseSerialGC
    networks:
      - escuela-network

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms64m -XX:+UseSerialGC
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - escuela-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8084:8084"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://auth-db:3306/auth_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=auth_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      auth-db:
        condition: service_healthy
    networks:
      - escuela-network

  admin-service:
    build: ./admin-service
    container_name: admin-service
    ports:
      - "8083:8083"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:mysql://admin-db:3306/admin_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=admin_user
      - SPRING_DATASOURCE_PASSWORD=admin_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_started
      admin-db:
        condition: service_healthy
    networks:
      - escuela-network

  alumno-service:
    build: ./alumno-service
    container_name: alumno-service
    ports:
      - "8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:mysql://alumno-db:3306/alumno_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=alumno_user
      - SPRING_DATASOURCE_PASSWORD=alumno_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_started
      alumno-db:
        condition: service_healthy
    networks:
      - escuela-network

  curso-service:
    build: ./curso-service
    container_name: curso-service
    ports:
      - "8082:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:mysql://curso-db:3306/curso_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=curso_user
      - SPRING_DATASOURCE_PASSWORD=curso_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_started
      curso-db:
        condition: service_healthy
    networks:
      - escuela-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - config-server
      - auth-service
      - admin-service
      - alumno-service
      - curso-service
    networks:
      - escuela-network

  frontend-escuela:
    image: brigitteca/escuela-front:latest
    container_name: frontend-escuela
    ports:
      - "4200:80"
    depends_on:
      - gateway-service
    networks:
      - escuela-network

volumes:
  auth_db_data:
  admin_db_data:
  alumno_db_data:
  curso_db_data:

networks:
  escuela-network:
    driver: bridge