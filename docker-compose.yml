services:
  mysqldb:
    image: mysql:8.0
    container_name: mysqldb
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: escuela_db
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - escuela-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - escuela-network

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms64m -XX:+UseSerialGC
    networks:
      - escuela-network

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms64m -XX:+UseSerialGC
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - escuela-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8084:8084"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
    depends_on:
      - eureka-server
      - config-server
      - mysqldb
    networks:
      - escuela-network

  admin-service:
    build: ./admin-service
    container_name: admin-service
    ports:
      - "8083:8083"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
    depends_on:
      - eureka-server
      - config-server
      - mysqldb
    networks:
      - escuela-network

  alumno-service:
    build: ./alumno-service
    container_name: alumno-service
    ports:
      - "8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - eureka-server
      - config-server
      - rabbitmq
      - mysqldb
    networks:
      - escuela-network

  curso-service:
    build: ./curso-service
    container_name: curso-service
    ports:
      - "8082:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - eureka-server
      - config-server
      - rabbitmq
      - mysqldb
    networks:
      - escuela-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - config-server
      - auth-service
      - admin-service
      - alumno-service
      - curso-service
    networks:
      - escuela-network

  frontend-escuela:
    build: ./frontend-escuela
    container_name: frontend-escuela
    ports:
      - "4200:80"
    depends_on:
      - gateway-service
    networks:
      - escuela-network

networks:
  escuela-network:
    driver: bridge