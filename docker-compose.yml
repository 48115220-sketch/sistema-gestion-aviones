version: '3.8'

services:
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass
      - MYSQL_USER=auth_user
      - MYSQL_PASSWORD=auth_pass
      - MYSQL_DATABASE=auth_database
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - terminal-network

  personal-db:
    image: mysql:8.0
    container_name: personal-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass
      - MYSQL_USER=personal_user
      - MYSQL_PASSWORD=personal_pass
      - MYSQL_DATABASE=personal_database
    ports:
      - "3308:3306"
    volumes:
      - personal_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - terminal-network

  vuelos-db:
    image: mysql:8.0
    container_name: vuelos-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass
      - MYSQL_USER=vuelos_user
      - MYSQL_PASSWORD=vuelos_pass
      - MYSQL_DATABASE=vuelos_database
    ports:
      - "3309:3306"
    volumes:
      - vuelos_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - terminal-network

  aviones-db:
    image: mysql:8.0
    container_name: aviones-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass
      - MYSQL_USER=aviones_user
      - MYSQL_PASSWORD=aviones_pass
      - MYSQL_DATABASE=aviones_database
    ports:
      - "3310:3306"
    volumes:
      - aviones_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - terminal-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - terminal-network

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms64m -XX:+UseSerialGC
    networks:
      - terminal-network

  config-server:
    build: ./config-server
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms64m -XX:+UseSerialGC
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/TU_USUARIO/TU_REPOSITORIO_CONFIG.git
      - SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL=main
    depends_on:
      - eureka-server
    networks:
      - terminal-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx320m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://auth-db:3306/auth_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=auth_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      auth-db:
        condition: service_healthy
    networks:
      - terminal-network

  personal-service:
    build: ./personal-service
    container_name: personal-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx320m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:mysql://personal-db:3306/personal_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=personal_user
      - SPRING_DATASOURCE_PASSWORD=personal_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_started
      personal-db:
        condition: service_healthy
    networks:
      - terminal-network

  vuelos-service:
    build: ./vuelos-service
    container_name: vuelos-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx320m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:mysql://vuelos-db:3306/vuelos_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=vuelos_user
      - SPRING_DATASOURCE_PASSWORD=vuelos_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_started
      vuelos-db:
        condition: service_healthy
    networks:
      - terminal-network

  aviones-service:
    build: ./aviones-service
    container_name: aviones-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx320m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:mysql://aviones-db:3306/aviones_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=aviones_user
      - SPRING_DATASOURCE_PASSWORD=aviones_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_started
      aviones-db:
        condition: service_healthy
    networks:
      - terminal-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms64m -XX:+UseSerialGC
      - SPRING_CLOUD_CONFIG_USERNAME=configuser
      - SPRING_CLOUD_CONFIG_PASSWORD=configpass123
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuser:configpass123@config-server:8888/
      - SPRING_CLOUD_CONFIG_URI=http://configuser:configpass123@config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - config-server
      - auth-service
      - personal-service
      - vuelos-service
      - aviones-service
    networks:
      - terminal-network

  frontend-terminal:
    image: brigitteca/terminal-front:latest
    container_name: frontend-terminal
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - gateway-service
    networks:
      - terminal-network

volumes:
  auth_db_data:
  personal_db_data:
  vuelos_db_data:
  aviones_db_data:

networks:
  terminal-network:
    driver: bridge